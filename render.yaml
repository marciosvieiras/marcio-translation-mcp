services:
  - type: web
    name: marcio-translation-mcp
    runtime: python
    buildCommand: pip install -r requirements.txt && python bootstrap_repo.py && python bootstrap.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MCP_MAX_SEGMENT_CHARS
        value: 8000
      - key: MCP_MAX_TERM_CHARS
        value: 240
